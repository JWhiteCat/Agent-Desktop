name: Release

# Pushing release/X.Y.Z only checks the branch name against package.json.
# Pushing vX.Y.Z builds installers and publishes that version's changelog.

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check version
        id: version
        run: |
          set -euo pipefail
          ref="$GITHUB_REF"
          if [ "${ref#refs/tags/v}" != "$ref" ]; then
            version="${ref#refs/tags/v}"
            kind="tag"
          elif [ "${ref#refs/heads/release/}" != "$ref" ]; then
            version="${ref#refs/heads/release/}"
            kind="branch"
          else
            echo "Unexpected ref: $ref"
            exit 1
          fi
          node --input-type=module -e "import { assertVersion } from './scripts/changelog.mjs'; assertVersion(process.argv[1])" "$version"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "$version" ]; then
            echo "package.json version ${package_version} does not match ${version}"
            exit 1
          fi
          if [ "$kind" = "tag" ]; then
            git fetch --no-tags origin "refs/heads/release/${version}"
            branch_tip="$(git rev-parse FETCH_HEAD)"
            # Checkout peels an annotated tag, so HEAD is the tagged commit.
            tagged_commit="$(git rev-parse HEAD)"
            if [ "$branch_tip" != "$tagged_commit" ]; then
              echo "release/${version} is ${branch_tip}, but ${ref} points at ${tagged_commit}"
              exit 1
            fi
          fi
          node scripts/changelog.mjs "$version" > /dev/null
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: verify
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.verify.result == 'success' }}
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --include=optional
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Check Electron runtime
        run: node -e "const fs = require('node:fs'); const path = require('node:path'); const root = path.dirname(require.resolve('electron/package.json')); const exe = fs.readFileSync(path.join(root, 'path.txt'), 'utf8').trim(); if (!exe || !fs.existsSync(path.join(root, 'dist', exe))) process.exit(1)"
      - name: Compile
        run: npx electron-vite build
      - name: Package Windows installers
        run: npx electron-builder --win portable nsis --x64 --publish never
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe
          if-no-files-found: error

  build-linux:
    needs: verify
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev --include=optional
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Check Electron runtime
        run: node -e "const fs = require('node:fs'); const path = require('node:path'); const root = path.dirname(require.resolve('electron/package.json')); const exe = fs.readFileSync(path.join(root, 'path.txt'), 'utf8').trim(); if (!exe || !fs.existsSync(path.join(root, 'dist', exe))) process.exit(1)"
      - name: Release publication regressions
        run: npm test -- test/release-latest.test.ts test/release-publication.test.ts test/release-workflow.test.ts --maxWorkers=4
        env:
          NODE_ENV: test
      - name: Package Linux installers
        run: npm run dist:linux
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  build-macos:
    needs: verify
    if: ${{ startsWith(github.ref, 'refs/tags/v') && needs.verify.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check native architecture
        run: node -e "if (process.arch !== '${{ matrix.arch }}') process.exit(1)"
      - name: Install dependencies
        run: npm ci --include=dev --include=optional
      - name: Install Electron runtime
        run: node node_modules/electron/install.js
      - name: Type check
        run: npm run typecheck
      - name: Offline tests
        run: npm test -- --maxWorkers=4
        env:
          NODE_ENV: test
      - name: Package macOS installer
        run: npm run dist:mac:${{ matrix.arch }}
      - name: Verify packaged macOS application
        run: npm run verify:mac -- release/agent-desktop-${{ needs.verify.outputs.version }}-mac-${{ matrix.arch }}.dmg ${{ matrix.arch }}
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: release/*-mac-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish:
    needs: [verify, build-windows, build-linux, build-macos]
    if: ${{ startsWith(github.ref, 'refs/tags/v') && success() }}
    runs-on: ubuntu-latest
    # Serialize only publication, not platform builds. Queue all waiting versions
    # rather than replacing the pending job; GitHub supports up to 100 waiters.
    concurrency:
      group: agent-desktop-release-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          node scripts/changelog.mjs "$VERSION" > release-notes.md
          node scripts/release-artifacts.mjs artifacts "$VERSION" > release-files.txt
          mapfile -t files < release-files.txt
          if gh release view "$tag" >/dev/null 2>&1; then
            draft="$(gh release view "$tag" --json isDraft --jq '.isDraft')"
            if [ "$draft" != "true" ]; then
              echo "Release ${tag} is already published; refusing to replace public assets"
              exit 1
            fi
            gh release edit "$tag" --title "Agent Desktop ${tag}" --notes-file release-notes.md
          else
            gh release create "$tag" --verify-tag --draft --title "Agent Desktop ${tag}" --notes-file release-notes.md
          fi
          gh release upload "$tag" "${files[@]}" --clobber
          # Read every page while holding the publication lock. Older backfills
          # remain public releases but must not displace a newer stable Latest.
          # Any API/JSON failure leaves this release in draft for a safe retry.
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > published-releases.json
          latest="$(node scripts/release-latest.mjs "$VERSION" published-releases.json)"
          gh release edit "$tag" --draft=false --prerelease=false --latest="$latest"
